[package]
name = "atelier-worker"
version = "0.1.0"
edition = "2021"
description = "Rust API and update-mail dispatcher for Atelier on Cloudflare Workers"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.6", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
url = "2"
futures-util = "0.3"

[profile.release]
lto = true
# wasm-bindgen 0.2.125+ 需要保留 externref 表；不能 strip=true。 / Keep the externref table required by wasm-bindgen 0.2.125+.
strip = "debuginfo"
codegen-units = 1
opt-level = "s"
